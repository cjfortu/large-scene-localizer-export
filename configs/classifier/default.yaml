# Classifier default config.

seed: 0

# Architecture
n_frames: 64                  # Input T; passed to Mover3DCNNTrans as t_dim. Determines
                              # classifier-head Linear input dim via t_dim // 8.
dropout_rate: 0.5             # Classifier-head MLP dropout.
attn_dropout: 0.1             # RelativeAttentionBlock dropout.
max_attn_len: 2200            # Accommodates 8 * 16 * 16 = 2048 tokens with buffer.

# Optimizer
lr: 1.0e-3

# Training
batch_size: 16
num_epochs: 75
num_workers: 4

# Data
dataset: swarm_128x128x64            # resolved under $LSL_DATA_ROOT
val_split: 0.1
val_split_seed: 91            # Stratified split seed per the original engineer.

# Output
run_name: classifier/default            # resolved under $LSL_RUNS_ROOT
