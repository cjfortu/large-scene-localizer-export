# 512 gate-precision ladder -- L3 (border + stem_stride=1 + cell-focal loss).
# Spec: documents/history/specs/stage1_gate_precision_ladder_512_spec.md.
#
# L3 = L2 PLUS the §4.3 loss reformulation bundle (attributed as ONE
# lever): loss_target='cell_focal' = cell-level focal on the 8x8 grid
# (logsumexp aggregation over each 16x16xT block) + retained per-voxel
# pos-weighted BCE aux (weight 0.5) + head bias-init to logit(p) of the
# empirical positive-CELL frequency (computed at startup, not hardcoded).
#
# FN-preference is bracketed (§4.3): focal alpha defaults to (1-p) [recall
# bias] by leaving cell_focal_alpha unset; the Tversky FN>FP term is held
# at zero weight at launch (the §7 one-retune budget may raise it if the
# arm under-recalls -- NOT cranked hot, to avoid the predict-everywhere
# flood). target_positive_pixels_per_frame stays frozen at 91.
model_factory: "v0_7"
arm: 2
stem_stride: 1                     # carried from L2
padding_mode: "replicate"          # carried from L1
loss_target: "cell_focal"          # §4.3 L3 lever
output_resolution: "low_res"
checkpoint_criterion: "best_unsplit_dice"
seed: 0
nfeats: 32
target_positive_pixels_per_frame: 91   # §6 frozen (pos_weight ~= 180; aux BCE)
lr: 1.0e-3
weight_decay: 1.0e-2
weight_decay_ssm: 0.0
scheduler_factor: 0.5
scheduler_patience: 10
batch_size: 1
num_epochs: 50                     # §6 frozen
subset_size: 3000
dataset: multi_target_swarm_512x512x64            # resolved under $LSL_DATA_ROOT
val_split: 0.1
val_split_seed: 0
run_name: gate/ladder_L3            # resolved under $LSL_RUNS_ROOT
num_workers: 4

use_bf16: false                    # §6 fp32

# Cell-focal loss hyperparameters (§4.3). alpha unset -> (1-p) recall bias.
# aggregation=maxpool: operator-selected resolution to the §4.3 open call
# (the spec's logsumexp primary was mis-calibrated vs the per-voxel-threshold
# 8x8 eval -- caught by the §5.1 overfit gate, predict-nothing collapse).
# maxpool is exactly eval-aligned: cell>0 <=> some voxel>0 <=> any-voxel rule.
cell_focal_aggregation: "maxpool"
cell_focal_cell_size: 16           # 128/16 = 8x8 grid (matches the eval)
cell_focal_gamma: 2.0
cell_focal_aux_weight: 0.5         # retained per-voxel localization BCE
cell_focal_tversky_weight: 0.0     # FN>FP term OFF at launch (§4.3 bracket)
cell_focal_tversky_alpha: 0.7
cell_focal_tversky_beta: 0.3

low_res_pool: [2, 4, 4]
detection_recall_ks: [1, 3, 5, 15]
secondary_recall_k: 15

proposal_patch_h: 64
proposal_patch_w: 64
cluster_chip_size: 128

gate_settle_min_epoch: 30
gate_abs_frac_bar: 0.25
