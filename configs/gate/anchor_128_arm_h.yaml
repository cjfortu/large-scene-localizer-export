# Stage 1 v0.9 — Arm H (hybrid control): v0.6 Arm 2 architecture verbatim
# on multi_target_swarm_128, hard-binary supervision. Inherits
# stage1_v0_6_arm_2_cnn_mamba_lowres.yaml unchanged except data_root,
# output_root, subset_size, target_positive_pixels_per_frame. v0.9 §4.1.
arm: 2
output_resolution: "low_res"
checkpoint_criterion: "best_unsplit_dice"
seed: 0
nfeats: 32
# v0.9 §4.1: tppf=128 anchor (= v0.6 Arm 2's tppf=16 × 8 multi-target
# density scaling). pos_weight = 32*32/128 = 8. §6.3 grid sweep validates.
target_positive_pixels_per_frame: 128
lr: 1.0e-3
weight_decay: 1.0e-2
weight_decay_ssm: 0.0
scheduler_factor: 0.5
scheduler_patience: 10
batch_size: 8
num_epochs: 150
subset_size: 3000
dataset: multi_target_swarm_128x128x64            # resolved under $LSL_DATA_ROOT
val_split: 0.1
val_split_seed: 0
run_name: gate/anchor_128_arm_h            # resolved under $LSL_RUNS_ROOT
num_workers: 4

# v0.9 §4.6: secondary checkpoint by recall@15. v0.9 §7.1 §8 detection
# accumulator extended with K=15. low_res_pool=(2,4,4) per Arm H §3.1.
low_res_pool: [2, 4, 4]
detection_recall_ks: [1, 3, 5, 15]
secondary_recall_k: 15
